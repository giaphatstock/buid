name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup vcpkg
        shell: cmd
        run: |
          if not exist C:\vcpkg (
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          )
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg install glfw3:x64-windows
          C:\vcpkg\vcpkg install "imgui[core,glfw-binding,opengl3-binding,freetype]:x64-windows"
          C:\vcpkg\vcpkg install implot:x64-windows

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -A x64

      - name: Build
        shell: cmd
        run: cmake --build build --config Release

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: LuxMonitor-Windows
          path: build/Release/
